<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des employés</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    
</head>
<body>
    <div class="theme-control-bar">
        <a href="{% url 'acceuil_arh' %}" class="btn btn-primary" id="dashboard-return">Retour au Dashboard</a>
        <button id="theme-toggle" class="btn btn-secondary">Mode Clair/Sombre</button>
    </div>

    <div class="container mt-5">
        <h1 class="mb-4">Liste des employés</h1>
        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Utilisateur</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for employe in employes %}
                <tr>
                    <td>{{ employe.id }}</td>
                    <td>{{ employe.nom }}</td>
                    <td>{{ employe.prenom }}</td>
                    <td>{{ employe.Employe_Utilisateur.Login }}</td>
                    <td>
                        <a href="{% url 'Fiche_employe' employe.id %}" class="btn btn-success btn-sm">Fiche_employe</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Bouton Terminer qui redirige vers AcceuilRH.html -->
        <a href="{% url 'acceuil-man' %}" class="btn btn-secondary mt-3">Terminer</a>
    </div>

   

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
