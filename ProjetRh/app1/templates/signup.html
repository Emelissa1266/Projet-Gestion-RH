<!DOCTYPE html>
<html lang="fr">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <!-- Lien vers Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="theme-control-bar">
        <a href="{% url 'acceuil_arh' %}" class="btn btn-primary" id="dashboard-return">Retour au Dashboard</a>
        <button id="theme-toggle" class="btn btn-secondary">Mode Clair/Sombre</button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Inscription</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="id_Login">Nom d'utilisateur</label>
                                {{ form.Login }}
                            </div>
                            <div class="form-group mt-3">
                                <label for="id_mot_de_passe">Mot de passe</label>
                                {{ form.mot_de_passe }}
                            </div>
                            <div class="form-group mt-3">
                                <label for="id_nom">Nom</label>
                                {{ form.nom }}
                            </div>
                            <div class="form-group mt-3">
                                <label for="id_prenom">Prénom</label>
                                {{ form.prenom }}
                            </div>
                            <div class="d-flex justify-content-between mt-4">
                                <button type="submit" class="btn btn-primary">S'inscrire</button>
                                <a href="{% url 'homecandidat' %}" class="btn btn-secondary">Annuler</a>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p>
                                Avez-vous un compte ? 
                                <a href="{% url 'connexion' %}" style="color: var(--main-color); font-weight: bold;">Connectez-vous ici</a>.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
