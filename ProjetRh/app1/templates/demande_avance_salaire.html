<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demander une avance sur votre salaire</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    
</head>
<body>
    <div class="theme-control-bar">
        <a href="{% url 'acceuil_arh' %}" class="btn btn-primary" id="dashboard-return">Retour au Dashboard</a>
        <button id="theme-toggle" class="btn btn-secondary">Mode Clair/Sombre</button>
    </div>

    <div class="container">
        <h1>Demander une avance sur le salaire</h1>
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>Informations De La Demande</legend>
                {{ form.as_p }}
            </fieldset>
            <div class="button-container">
            <button type="submit" class="btn btn-primary">Envoyer la demande</button>
            <a href="{% url 'Mes_salaires' utilisateur %}" class="btn btn-secondary mt-3">Retour</a>
        </div>
        </form>
        
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
