<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <title>Authentification</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    
    
</head>
<body>
    <div class="theme-control-bar">
        <a href="{% url 'acceuil_arh' %}" class="btn btn-primary" id="dashboard-return">Retour au Dashboard</a>
        <button id="theme-toggle" class="btn btn-secondary">Mode Clair/Sombre</button>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-header text-center">
                        <h3 class="card-title">Authentifiez-vous</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">Se connecter</button>
                                <a href="{% url 'homecandidat' %}" class="btn btn-secondary">Annuler</a>
                            </div>
                        </form>
                        <div class="extra-links">
                            <p>
                                Vous n'avez pas de compte ? <a href="{% url 'inscription' %}">Créez-en un !</a><br>
                                <a href="#"> Mot de passe oublié ?</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
