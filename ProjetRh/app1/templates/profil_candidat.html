{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil Professionnel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    
</head>
<body>
    <div class="theme-control-bar">
        <a href="{% url 'acceuil_arh' %}" class="btn btn-primary" id="dashboard-return">Retour au Dashboard</a>
        <button id="theme-toggle" class="btn btn-secondary">Mode Clair/Sombre</button>
    </div>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="header-content">
                    <i class="fas fa-user-circle profile-icon"></i>
                    <h1>Mon Profil</h1>
                </div>
            </div>
            
            <div class="profile-body">
                <form method="post" class="profile-form">
                    {% csrf_token %}
                    <div class="form-group">
                        {% for field in form %}
                        <div class="input-group">
                            <label for="{{ field.id_for_label }}" class="form-label">
                                {{ field.label }}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="error-message">
                                {{ field.errors }}
                            </div>
                            {% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn btn-save">
                            <i class="fas fa-save"></i>
                            Sauvegarder
                        </button>
                        <a href="{% url 'acceuil-cand' utilisateur.id %}" class="btn btn-back">
                            <i class="fas fa-arrow-left"></i>
                            Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
